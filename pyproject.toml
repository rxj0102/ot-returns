[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ot-returns"
version = "0.1.0"
description = "Optimal Transport Theory Applied to Cross-Sectional Equity Return Distributions"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "pandas>=1.3",
    "scikit-learn>=1.0",
    "matplotlib>=3.4",
    "seaborn>=0.11",
    "POT>=0.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "jupyter>=1.0",
    "ipykernel>=6.0",
    "nbformat>=5.0",
]

[project.urls]
Repository = "https://github.com/rxj0102/ot-returns"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.hatch.build.targets.wheel]
packages = ["otreturns"]
